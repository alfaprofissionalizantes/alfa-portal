<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">

{% extends "professor/base_professor.html" %}

{% block titulo %}Notas{% endblock %}
{% block pagina_titulo %}Notas{% endblock %}

{% block estilo %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/notas.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/faltas.css') }}">
{% endblock %}

{% block conteudo %}

<div class="notas-prof-wrapper">
  <div class="notas-prof-card">

    <div class="campo-grupo">
      <label class="campo-label">Aluno</label>
      <input type="text" class="campo-input" id="busca-aluno-nota"
             placeholder="Digite o nome ou a matrícula..."
             oninput="buscarAlunoNota()" autocomplete="off"/>
      <input type="hidden" id="aluno-id-nota"/>
      <div id="resultado-busca-nota"
           style="margin-top:8px; max-height:200px; overflow-y:auto; border:1px solid #e2e8f0; border-radius:8px; display:none;"></div>
    </div>

    <div class="campo-grupo">
      <label class="campo-label">Turma</label>
      <select class="campo-select" id="select-turma-nota" disabled>
        <option value="">Selecione o aluno primeiro</option>
      </select>
    </div>

    <div class="notas-prof-divisor"></div>
    <div class="notas-prof-secao-label">Dados da atividade</div>

    <div class="campo-grupo">
      <label class="campo-label">Nome da atividade</label>
      <input type="text" class="campo-input" id="input-atividade" placeholder="Ex: Atividade 2"/>
    </div>

    <div class="notas-prof-linha">
      <div class="campo-grupo">
        <label class="campo-label">Mês relacionado</label>
        <select class="campo-select" id="input-mes">
          <option value="">Selecione o mês</option>
          {% for num, nome in nomes_meses.items() %}
          <option value="{{ num }}">{{ nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="campo-grupo campo-nota">
        <label class="campo-label">Nota</label>
        <input type="number" class="campo-input campo-input-nota" id="input-nota" placeholder="0.0" min="0" max="10" step="0.1"/>
      </div>
    </div>

    <div id="msg-nota" style="display:none; padding:10px; border-radius:8px; font-size:0.88rem; text-align:center;"></div>

    <button class="btn-salvar-nota-prof" onclick="salvarNota()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
        <path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/>
      </svg>
      Salvar Nota
    </button>

  </div>
</div>

{% endblock %}

{% block script %}
<script>
let buscaNotaTimeout = null;

function buscarAlunoNota() {
  const termo     = document.getElementById('busca-aluno-nota').value;
  const resultado = document.getElementById('resultado-busca-nota');
  const selTurma  = document.getElementById('select-turma-nota');

  // qualquer digitação invalida a seleção anterior
  document.getElementById('aluno-id-nota').value = '';
  selTurma.disabled = true;
  selTurma.innerHTML = '<option value="">Selecione o aluno primeiro</option>';

  if (termo.length < 2) { resultado.style.display = 'none'; return; }

  clearTimeout(buscaNotaTimeout);
  buscaNotaTimeout = setTimeout(() => {
    fetch(`/professor/buscar_alunos_relatorio?q=${encodeURIComponent(termo)}`)
      .then(r => r.json())
      .then(alunos => {
        if (alunos.length === 0) {
          resultado.innerHTML = '<p style="padding:12px; color:#94a3b8; font-size:0.85rem;">Nenhum aluno encontrado.</p>';
        } else {
          resultado.innerHTML = alunos.map(a => `
            <div onclick="selecionarAlunoNota(${a.id}, '${(a.nome || '').replace(/'/g, "\\'")}', '${a.matricula}')"
                 style="padding:10px 14px; cursor:pointer; font-size:0.88rem; border-bottom:1px solid #f1f5f9;"
                 onmouseover="this.style.background='#f8faff'" onmouseout="this.style.background='white'">
              ${a.nome} — Mat. ${a.matricula}
            </div>
          `).join('');
        }
        resultado.style.display = 'block';
      });
  }, 300);
}

function selecionarAlunoNota(alunoId, nome, matricula) {
  document.getElementById('aluno-id-nota').value   = alunoId;
  document.getElementById('busca-aluno-nota').value = `${nome} — Mat. ${matricula}`;
  document.getElementById('resultado-busca-nota').style.display = 'none';
  carregarTurmasDoAluno(alunoId);
}

function carregarTurmasDoAluno(alunoId, turmaPreSelecionada) {
  const selTurma = document.getElementById('select-turma-nota');
  selTurma.disabled  = true;
  selTurma.innerHTML = '<option value="">Carregando...</option>';

  fetch(`/professor/turmas_do_aluno/${alunoId}`)
    .then(r => r.json())
    .then(d => {
      // se veio por link direto, preenche o nome do aluno no campo
      const campoBusca = document.getElementById('busca-aluno-nota');
      if (!campoBusca.value && d.aluno) {
        campoBusca.value = `${d.aluno.nome} — Mat. ${d.aluno.matricula}`;
      }

      if (!d.turmas || d.turmas.length === 0) {
        selTurma.innerHTML = '<option value="">Aluno não está em nenhuma turma</option>';
        return;
      }

      selTurma.innerHTML = '<option value="">Selecione a turma</option>';
      d.turmas.forEach(t => {
        selTurma.innerHTML += `<option value="${t.turma_id}">${t.curso} — ${t.turma} (${t.dias_semana} ${t.horario})</option>`;
      });
      selTurma.disabled = false;

      if (turmaPreSelecionada) {
        selTurma.value = turmaPreSelecionada;
      } else if (d.turmas.length === 1) {
        selTurma.value = d.turmas[0].turma_id;
      }
    });
}

function salvarNota() {
  const aluno_id  = document.getElementById('aluno-id-nota').value;
  const turma_id  = document.getElementById('select-turma-nota').value;
  const atividade = document.getElementById('input-atividade').value;
  const mes       = document.getElementById('input-mes').value;
  const nota      = document.getElementById('input-nota').value;
  const msg       = document.getElementById('msg-nota');

  if (!aluno_id || !turma_id || !atividade || !mes || !nota) {
    msg.style.display = 'block';
    msg.style.background = '#fee2e2';
    msg.style.color = '#dc2626';
    msg.textContent = 'Preencha todos os campos!';
    setTimeout(() => msg.style.display = 'none', 3000);
    return;
  }

  fetch('/professor/salvar_nota', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ turma_id, aluno_id, atividade, mes, nota })
  })
  .then(r => r.json())
  .then(data => {
    msg.style.display = 'block';
    if (data.ok) {
      msg.style.background = '#dcfce7';
      msg.style.color = '#16a34a';
      msg.textContent = 'Nota salva com sucesso!';
      document.getElementById('input-atividade').value = '';
      document.getElementById('input-nota').value = '';
    } else {
      msg.style.background = '#fee2e2';
      msg.style.color = '#dc2626';
      msg.textContent = 'Erro ao salvar nota.';
    }
    setTimeout(() => msg.style.display = 'none', 3000);
  });
}

document.addEventListener('DOMContentLoaded', function() {
  const params     = new URLSearchParams(window.location.search);
  const turmaParam = params.get('turma');
  const alunoParam = params.get('aluno');

  if (alunoParam) {
    document.getElementById('aluno-id-nota').value = alunoParam;
    carregarTurmasDoAluno(alunoParam, turmaParam);
  }
});
</script>
{% endblock %}
